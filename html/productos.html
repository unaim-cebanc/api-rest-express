<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
</head>
<body>
    <h1>Productos</h1>
    <hr>
    <div class="contenedor">
        <h2>Todos los productos</h2>
        <hr>
        <div id="contenedor_todos" class="contenedor_productos"></div>
    </div>
    <br>
    <div class="contenedor">
        <h2>Buscar por id</h2>
        <hr>
        <form data-url="/productos" data-method="GET">
            <label for="id_get"></label>
            <input type="number" id="id_get" required>
            <button type="submit">Buscar</button>
        </form>
        <div id="contenedor_busqueda" class="contenedor_productos"></div>
    </div>
    <div class="contenedor">
        <h2>Añadir producto</h2>
        <hr>
        <form data-url="/productos" data-method="POST">
            <label for="id_post">Id</label>
            <input type="number" id="id_post" required>
            
            <label for="nombre_post">Nombre</label>
            <input type="text" id="nombre_post" required>
            
            <label for="precio_post">Precio</label>
            <input type="number" id="precio_post" required>
            
            <label for="categoriaId_post">Id Categoría</label>
            <input type="number" id="categoriaId_post" required>
            <button type="submit">Añadir</button>
        </form>
    </div>
    <div class="contenedor">
        <h2>Actualizar producto</h2>
        <hr>
        <form data-url="/productos" data-method="PUT">
            <label for="id_put">Id</label>
            <input type="number" id="id_put" required>
            
            <label for="nombre_put">Nombre</label>
            <input type="text" id="nombre_put">
            
            <label for="precio_put">Precio</label>
            <input type="number" id="precio_put">
            <button type="submit">Actualizar</button>
        </form>
    </div>
    <div class="contenedor">
        <h2>Eliminar producto</h2>
        <hr>
        <form data-url="/productos" data-method="DELETE">
            <label for="id_delete">Id</label>
            <input type="number" id="id_delete" required>
            <button type="submit">Eliminar</button>
        </form>
    </div>
    <div class="contenedor_link">
        <a href="/" class="volver">Volver</a>
    </div>
</body>
</html>
